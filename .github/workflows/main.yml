
name: PS5X Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract PS5X ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "*.zip" -File | Select-Object -First 1
          if (-not $zip) {
            throw "No project ZIP found."
          }
          Expand-Archive -Path $zip.FullName -DestinationPath source -Force

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          cmake_file=$(find source -name CMakeLists.txt -type f | head -n 1)
          if [ -z "$cmake_file" ]; then
            echo "CMakeLists.txt not found"
            exit 1
          fi
          src=$(dirname "$cmake_file")
          cmake -S "$src" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Get-ChildItem build -Filter "*.exe" -Recurse -File |
            Copy-Item -Destination package -Force
          Get-ChildItem build -Filter "*.dll" -Recurse -File |
            Copy-Item -Destination package -Force
          if (-not (Get-ChildItem package -Filter "*.exe" -File)) {
            throw "No Windows executables produced."
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath PS5X-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5X-Windows
          path: PS5X-Windows.zip
